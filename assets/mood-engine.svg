<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <style>
      .mono { font: 11px/1.6 'SF Mono', 'Fira Code', monospace; }
      .head { font: 12px/1 'SF Mono', 'Fira Code', monospace; font-weight: 700; fill: #fff; }
      .dim  { fill: rgba(255,255,255,0.35); }
      .acc  { fill: #E82E11; }
      .grn  { fill: #4ade80; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.3)"/>
    </marker>
  </defs>
  <rect width="760" height="220" fill="#0D1017" rx="12"/>

  <!-- baseline -->
  <rect x="20" y="24" width="200" height="176" rx="8" fill="#12151C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="36" y="48" class="head">baseline</text>
  <rect x="36" y="62" width="60" height="16" rx="3" fill="#C2200E"/>
  <text x="104" y="74" class="mono dim">--accent</text>
  <text x="36" y="102" class="mono dim">weight-display: </text><text x="150" y="102" class="mono" fill="#fff">700</text>
  <text x="36" y="124" class="mono dim">type-display-1:</text>
  <text x="36" y="142" class="mono dim" style="font-size:9px">clamp(3rem, 7vw, 5rem)</text>
  <text x="36" y="174" class="mono dim" style="font-size:9px">shadow: 0 4px 16px …</text>

  <!-- arrow 1 -->
  <line x1="228" y1="112" x2="274" y2="112" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="236" y="100" class="mono dim" style="font-size:9px">mood apply</text>
  <text x="234" y="130" class="mono acc" style="font-size:10px;font-weight:700">performance</text>

  <!-- performance -->
  <rect x="280" y="24" width="200" height="176" rx="8" fill="#12151C" stroke="#E82E11" stroke-width="1" stroke-opacity="0.4"/>
  <text x="296" y="48" class="head">performance</text>
  <rect x="296" y="62" width="60" height="16" rx="3" fill="#FF3A1A"/>
  <text x="364" y="74" class="mono grn" style="font-size:9px">▲ vivid</text>
  <text x="296" y="102" class="mono dim">weight-display: </text><text x="410" y="102" class="mono grn">900</text>
  <text x="296" y="124" class="mono dim">type-display-1:</text>
  <text x="296" y="142" class="mono grn" style="font-size:9px">clamp(3rem, 8vw, 6rem) ▲</text>
  <text x="296" y="174" class="mono grn" style="font-size:9px">shadow: dramatic ▲</text>

  <!-- arrow 2 -->
  <line x1="488" y1="112" x2="534" y2="112" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="496" y="100" class="mono dim" style="font-size:9px">mood apply</text>
  <text x="490" y="130" class="mono" fill="#93c5fd" style="font-size:10px;font-weight:700">minimalist</text>

  <!-- quiet -->
  <rect x="540" y="24" width="200" height="176" rx="8" fill="#12151C" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="556" y="48" class="head">quiet</text>
  <rect x="556" y="62" width="60" height="16" rx="3" fill="#8B5A4A" opacity="0.5"/>
  <text x="624" y="74" class="mono" fill="#93c5fd" style="font-size:9px">▼ soft</text>
  <text x="556" y="102" class="mono dim">weight: </text><text x="610" y="102" class="mono" fill="#93c5fd">300</text>
  <text x="556" y="124" class="mono" fill="#93c5fd" style="font-size:9px">lighter, wider</text>
  <text x="556" y="152" class="mono dim" style="font-size:9px">accent barely</text>
  <text x="556" y="168" class="mono dim" style="font-size:9px">breathes</text>
</svg>
